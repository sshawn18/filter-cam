name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Same debug signing key as the owner's local builds, so the APK installs over the existing app.
      - name: Install debug keystore
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          else
            echo "No DEBUG_KEYSTORE_B64 secret set: building with a fresh debug key"
          fi

      - run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FilterCam-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FilterCam-debug.apk --title "Latest build" --notes "Built from commit ${GITHUB_SHA::7}" --prerelease
